name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Release Gate Aggregate
        run: npm run verify:release-gate

      - name: Upload Release Gate Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: docs/status/release-gate-latest.json
          if-no-files-found: warn
