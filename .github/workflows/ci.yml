name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

# Grant the id-token write permission needed for AWS OIDC role assumption.
# See: https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      # AWS OIDC — assumes the IAM role whose ARN is stored in the
      # AWS_OIDC_ROLE_ARN secret. Falls back gracefully when the secret is
      # not yet configured (e.g. during Clerk-key-only CI runs).
      # Manual prerequisite: create an AWS IAM OIDC provider for
      # token.actions.githubusercontent.com and an IAM role with a trust
      # policy allowing this repo's GitHub Actions workflows.
      # See docs/runbooks/aws-oidc-setup.md for step-by-step instructions.
      - name: Configure AWS credentials (OIDC)
        if: ${{ secrets.AWS_OIDC_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          # Short-lived credentials — default session duration is 1 hour
          role-session-name: rwfw-los-ci-${{ github.run_id }}

      - name: Release Gate Aggregate
        run: npm run verify:release-gate
        env:
          LEDGER_CONSISTENCY_ALLOW_SKIP: "true"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
          E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
          E2E_STUDENT_INDEPENDENT_EMAIL: ${{ secrets.E2E_STUDENT_INDEPENDENT_EMAIL }}
          E2E_STUDENT_INDEPENDENT_PASSWORD: ${{ secrets.E2E_STUDENT_INDEPENDENT_PASSWORD }}
          E2E_STUDENT_ENROLLED_EMAIL: ${{ secrets.E2E_STUDENT_ENROLLED_EMAIL }}
          E2E_STUDENT_ENROLLED_PASSWORD: ${{ secrets.E2E_STUDENT_ENROLLED_PASSWORD }}
          E2E_ADULT_LEARNER_EMAIL: ${{ secrets.E2E_ADULT_LEARNER_EMAIL }}
          E2E_ADULT_LEARNER_PASSWORD: ${{ secrets.E2E_ADULT_LEARNER_PASSWORD }}
          E2E_PROFESSIONAL_DEVELOPMENT_EMAIL: ${{ secrets.E2E_PROFESSIONAL_DEVELOPMENT_EMAIL }}
          E2E_PROFESSIONAL_DEVELOPMENT_PASSWORD: ${{ secrets.E2E_PROFESSIONAL_DEVELOPMENT_PASSWORD }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_SQS_QUEUE_URL: ${{ secrets.AWS_SQS_QUEUE_URL }}
          AWS_SQS_DLQ_URL: ${{ secrets.AWS_SQS_DLQ_URL }}
          AWS_DYNAMODB_ORCHESTRATION_TABLE: ${{ secrets.AWS_DYNAMODB_ORCHESTRATION_TABLE }}
          AWS_EVENTBRIDGE_BUS_NAME: ${{ secrets.AWS_EVENTBRIDGE_BUS_NAME }}
          BEDROCK_MODEL_ID: "amazon.titan-text-express-v1"

      - name: Upload Release Gate Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: docs/status/release-gate-latest.json
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Role E2E
        run: npm run verify:role-e2e
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
          E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
          E2E_STUDENT_INDEPENDENT_EMAIL: ${{ secrets.E2E_STUDENT_INDEPENDENT_EMAIL }}
          E2E_STUDENT_INDEPENDENT_PASSWORD: ${{ secrets.E2E_STUDENT_INDEPENDENT_PASSWORD }}
          E2E_STUDENT_ENROLLED_EMAIL: ${{ secrets.E2E_STUDENT_ENROLLED_EMAIL }}
          E2E_STUDENT_ENROLLED_PASSWORD: ${{ secrets.E2E_STUDENT_ENROLLED_PASSWORD }}
          E2E_ADULT_LEARNER_EMAIL: ${{ secrets.E2E_ADULT_LEARNER_EMAIL }}
          E2E_ADULT_LEARNER_PASSWORD: ${{ secrets.E2E_ADULT_LEARNER_PASSWORD }}
          E2E_PROFESSIONAL_DEVELOPMENT_EMAIL: ${{ secrets.E2E_PROFESSIONAL_DEVELOPMENT_EMAIL }}
          E2E_PROFESSIONAL_DEVELOPMENT_PASSWORD: ${{ secrets.E2E_PROFESSIONAL_DEVELOPMENT_PASSWORD }}
          E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
          E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}

      - name: Upload E2E Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-e2e-screenshots
          path: docs/qa/artifacts/role-e2e/**
          if-no-files-found: warn
