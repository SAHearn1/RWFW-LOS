name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Runtime Route Smoke
        run: npm run verify:runtime-routes

      - name: Role Route Verify
        run: npm run verify:role-routes

      - name: Env Completeness Verify
        run: npm run verify:env

      - name: Onboarding Selector Verify
        run: npm run verify:onboarding

      - name: Live HTTP Smoke
        run: npm run verify:http-smoke
